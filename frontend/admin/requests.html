<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPGen Admin — Subject Requests</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../theme.css">
    <style>
        :root {
            --black: #080808;
            --deep: #0e0e0e;
            --surface: #141414;
            --card: #1a1a1a;
            --border: rgba(255, 255, 255, 0.07);
            --gold: #c9a84c;
            --white: #f5f0e8;
            --muted: #5a5a5a;
            --text: #b8b3a8;
            --sw: 220px;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sw);
            background: var(--deep);
            border-right: 1px solid var(--border);
            padding: 32px 20px;
            position: fixed;
            height: 100vh;
        }

        .main {
            margin-left: var(--sw);
            flex: 1;
            padding: 64px 60px;
        }

        .header {
            margin-bottom: 48px;
        }

        .h-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.8em;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .h-sub {
            color: var(--muted);
            font-size: 0.9em;
        }

        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .table-header {
            display: grid;
            grid-template-columns: 1.5fr 1.5fr 1.5fr 1fr;
            padding: 16px 28px;
            background: var(--deep);
            border-bottom: 1px solid var(--border);
            font-family: 'DM Mono', monospace;
            font-size: 0.65em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .table-row {
            display: grid;
            grid-template-columns: 1.5fr 1.5fr 1.5fr 1fr;
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }

        .table-row:last-child { border-bottom: none; }

        .user-info { font-size: 0.85em; font-weight: 600; color: var(--text); }
        .sub-name { font-size: 0.85em; color: var(--gold); }
        .req-date { font-family: 'DM Mono', monospace; font-size: 0.7em; color: var(--muted); }

        .btn-action {
            font-family: 'DM Mono', monospace;
            font-size: 0.65em;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 12px;
            border: 1px solid;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
        }

        .btn-approve { border-color: var(--gold); color: var(--gold); }
        .btn-approve:hover { background: rgba(201,168,76,0.1); }
        .btn-reject { border-color: #dc2626; color: #dc2626; }
        .btn-reject:hover { background: rgba(220,38,38,0.1); }

        .empty-state {
            padding: 60px;
            text-align: center;
            color: var(--muted);
            font-style: italic;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        .nav-item:hover { color: var(--white); }
        .nav-item.active { color: var(--gold); font-weight: 600; }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            color: var(--gold);
            margin-bottom: 40px;
            padding: 0 10px;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="logo">QPGen.</div>
        <div style="font-family:'DM Mono',monospace; font-size:0.6em; color:var(--muted); letter-spacing:2px; margin-bottom:15px; padding:0 10px">ADMINISTRATION</div>
        <a href="teachers.html" class="nav-item">◈ Teachers</a>
        <a href="requests.html" class="nav-item active">◉ Subject Requests</a>
        <div style="margin-top:30px; border-top:1px solid var(--border); padding-top:20px">
            <a href="../dashboard.html" class="nav-item">← Back to App</a>
        </div>
    </aside>

    <main class="main">
        <div class="header">
            <h1 class="h-title">Subject Requests</h1>
            <p class="h-sub">Review and approve teacher requests for subject access.</p>
        </div>

        <div class="table-container">
            <div class="table-header">
                <div>Teacher</div>
                <div>Requested Subject</div>
                <div>Date</div>
                <div>Actions</div>
            </div>
            <div id="reqList">
                <!-- Dynamic Content -->
            </div>
        </div>
    </main>

    <script>
        const API = 'http://127.0.0.1:5000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '../index.html';

        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!user.roles || !user.roles.includes('admin')) {
            window.location.href = '../dashboard.html';
        }

        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        async function loadRequests() {
            const res = await fetch(`${API}/admin/subject-requests?status=pending`, { headers });
            const data = await res.json();
            const reqs = data.data || [];
            const el = document.getElementById('reqList');

            if (!reqs.length) {
                el.innerHTML = '<div class="empty-state">No pending requests found.</div>';
                return;
            }

            el.innerHTML = reqs.map(r => `
                <div class="table-row">
                    <div class="user-info">${r.username}</div>
                    <div class="sub-name">${r.subject_name} (${r.subject_code})</div>
                    <div class="req-date">${new Date(r.created_at).toLocaleDateString()}</div>
                    <div>
                        <button class="btn-action btn-approve" onclick="handleReq(${r.id}, 'approve')">Approve</button>
                        <button class="btn-action btn-reject" onclick="handleReq(${r.id}, 'reject')">Reject</button>
                    </div>
                </div>
            `).join('');
        }

        async function handleReq(id, action) {
            if (!confirm(`Are you sure you want to ${action} this request?`)) return;
            const res = await fetch(`${API}/admin/subject-requests/${id}/action`, {
                method: 'POST',
                headers,
                body: JSON.stringify({ action })
            });
            const data = await res.json();
            if (data.success) {
                alert(`Request ${action}ed!`);
                loadRequests();
            } else {
                alert(data.message || 'Action failed');
            }
        }

        loadRequests();
    </script>
</body>

</html>
