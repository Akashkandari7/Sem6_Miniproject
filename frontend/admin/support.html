<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPGen Admin — Helpdesk Terminal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #050505; --deep: #0a0a0a; --surface: #0f0f0f;
            --card: rgba(25, 25, 25, 0.6); --border: rgba(255, 255, 255, 0.08);
            --gold: #c9a84c; --gold-light: #e2c07a; --violet: #8e44ad;
            --white: #f5f0e8; --muted: #5a5a5a; --text: #a8a39a; --sw: 240px;
        }

        html, body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
        .ambient-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(201, 168, 76, 0.05) 0%, transparent 70%); bottom: -100px; right: -100px; }

        .layout { display: flex; min-height: 100vh; }

        /* ── SIDEBAR ── */
        .sidebar { width: var(--sw); background: rgba(10,10,10,0.8); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; padding: 40px 24px; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 60px; }
        .logo-mark { width: 32px; height: 32px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; color: var(--gold); }
        .logo-text { font-family: 'DM Mono', monospace; font-size: 0.75em; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
        
        .nav-section { font-family: 'DM Mono', monospace; font-size: 0.6em; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 24px 0 12px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; color: var(--text); text-decoration: none; font-size: 0.85em; transition: all 0.3s; margin-bottom: 4px; }
        .nav-item:hover, .nav-item.active { color: var(--gold); background: rgba(201, 168, 76, 0.04); }

        /* ── MAIN ── */
        .main { margin-left: var(--sw); flex: 1; padding: 80px; }
        .page-hdr { margin-bottom: 60px; }
        .page-hdr h1 { font-family: 'Playfair Display', serif; font-size: 3.5em; font-weight: 900; letter-spacing: -2px; line-height: 1; }
        .page-hdr h1 em { font-style: italic; color: var(--gold); }

        /* ── HELPDESK TERMINAL ── */
        .terminal { display: flex; flex-direction: column; gap: 20px; }
        .ticket { background: var(--surface); border: 1px solid var(--border); padding: 40px; }
        .ticket-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .ticket-meta { display: flex; flex-direction: column; gap: 4px; }
        .prof-name { font-family: 'DM Mono'; font-size: 0.8em; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        .prof-email { font-size: 0.8em; color: var(--muted); }
        .ticket-date { font-family: 'DM Mono'; font-size: 0.65em; color: var(--muted); }

        .ticket-sub { font-family: 'Playfair Display'; font-size: 1.5em; font-weight: 700; color: var(--white); margin-bottom: 16px; }
        .ticket-msg { font-size: 1em; line-height: 1.7; color: var(--text); background: rgba(255,255,255,0.02); padding: 24px; border-left: 1px solid var(--gold); }

        .ticket-foot { margin-top: 30px; display: flex; justify-content: flex-end; gap: 16px; }
        .btn { padding: 12px 24px; font-family: 'DM Mono'; font-size: 0.65em; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; background: transparent; border: 1px solid var(--border); color: var(--white); }
        .btn-resolve { border-color: var(--gold); color: var(--gold); }
        .btn-resolve:hover { background: rgba(201,168,76,0.1); }

        .status-pill { font-family: 'DM Mono'; font-size: 0.55em; padding: 4px 10px; background: var(--gold-dim); color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

    </style>
</head>

<body>
    <div class="ambient-bg"><div class="glow"></div></div>

    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><div class="logo-mark">Q</div><div class="logo-text">QPGen</div></div>
            <div class="nav-section">Workspace</div>
            <a href="../dashboard.html" class="nav-item">Dashboard</a>
            <a href="../questions.html" class="nav-item">Question Bank</a>
            <div class="nav-section">Administration</div>
            <a href="teachers.html" class="nav-item">Faculty Archives</a>
            <a href="requests.html" class="nav-item">Access Requests</a>
            <a href="support.html" class="nav-item active">Support Desk</a>
            <div style="margin-top: auto;"><a href="#" class="nav-item" onclick="logout()">Sign Out</a></div>
        </aside>

        <main class="main">
            <header class="page-hdr">
                <p style="font-family:'DM Mono'; font-size:0.7em; color:var(--gold); letter-spacing:3px; text-transform:uppercase;">Institutional Care</p>
                <h1>Faculty<br><em>Support Desk.</em></h1>
            </header>

            <div class="terminal" id="ticketList">
                <div style="padding:100px; text-align:center; font-family:'DM Mono'; color:var(--muted); font-size:0.8em; letter-spacing:2px;">SCANNING FOR PENDING TICKETS...</div>
            </div>
        </main>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000/api';
        const token = localStorage.getItem('token');
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        async function loadTickets() {
            try {
                const res = await fetch(`${API}/admin/support?status=pending`, { headers });
                const d = await res.json();
                const tickets = d.data || [];
                const el = document.getElementById('ticketList');

                if (tickets.length === 0) {
                    el.innerHTML = '<div style="padding:100px; text-align:center; font-family:\'DM Mono\'; color:var(--muted); font-size:0.8em;">ALL PROTOCOLS STABLE — NO PENDING TICKETS</div>';
                    return;
                }

                el.innerHTML = tickets.map(t => `
                    <div class="ticket">
                        <div class="ticket-head">
                            <div class="ticket-meta">
                                <div class="prof-name">${t.username}</div>
                                <div class="prof-email">ARCHIVE ID: T-${t.user_id}</div>
                            </div>
                            <div class="ticket-date">${new Date(t.created_at).toLocaleString().toUpperCase()}</div>
                        </div>
                        <div class="ticket-sub">${t.subject}</div>
                        <div class="ticket-msg">"${t.message}"</div>
                        <div class="ticket-foot">
                            <button class="btn btn-resolve" onclick="resolveTicket(${t.id})">Mark as Resolved</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function resolveTicket(id) {
            if (!confirm(`Mark ticket protocol ${id} as resolved?`)) return;
            try {
                const res = await fetch(`${API}/admin/support/${id}/resolve`, { method: 'POST', headers });
                if (res.ok) loadTickets(); else alert('Resolution Protocol Failed');
            } catch (e) { alert('System Link Failure'); }
        }

        function logout() { localStorage.clear(); window.location.href = '../index.html'; }
        loadTickets();
    </script>
</body>

</html>
