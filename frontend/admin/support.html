<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPGen Admin — Helpdesk Terminal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="../style.css" rel="stylesheet">
    <style>
        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ticket {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            display: flex;
            gap: 32px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .ticket:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .t-user {
            width: 220px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            padding-right: 32px;
        }

        .t-user-av {
            width: 48px;
            height: 48px;
            background: var(--brand-dim);
            color: var(--brand);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .t-user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9em;
        }

        .t-user-email {
            font-family: 'DM Mono';
            font-size: 0.65em;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .t-content {
            flex: 1;
        }

        .t-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .t-subject {
            font-family: 'DM Sans';
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.1em;
        }

        .t-date {
            font-family: 'DM Mono';
            font-size: 0.7em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .t-msg {
            color: var(--text-secondary);
            font-size: 0.95em;
            line-height: 1.6;
        }

        .t-status {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .st-badge {
            font-family: 'DM Mono';
            font-size: 0.6em;
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--brand-dim);
            color: var(--brand);
            font-weight: 700;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="ambient-bg">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <a href="../dashboard.html" class="logo">
                <div class="logo-mark">QP</div>
                <span class="logo-text">QPGen</span>
            </a>

            <div class="nav-section">Workspace</div>
            <a href="../dashboard.html" class="nav-item">
                <span class="nav-icon">▤</span> Dashboard
            </a>
            <a href="../questions.html" class="nav-item">
                <span class="nav-icon">⚄</span> Question Bank
            </a>
            <a href="../generate.html" class="nav-item">
                <span class="nav-icon">✦</span> Generate Paper
            </a>

            <div class="nav-section">Management</div>
            <a href="../profile.html" class="nav-item">
                <span class="nav-icon">👤</span> Account Profile
            </a>

            <div class="nav-section">University Admin</div>
            <a href="teachers.html" class="nav-item">
                <span class="nav-icon">⌘</span> Manage Faculty
            </a>
            <a href="requests.html" class="nav-item">
                <span class="nav-icon">✉</span> Access Requests
            </a>
            <a href="support.html" class="nav-item active">
                <span class="nav-icon">☏</span> Support Desk
            </a>

            <div class="sidebar-footer">
                <div class="user-pill" onclick="location.href='../profile.html'">
                    <div class="avatar" id="av">P</div>
                    <div class="user-meta">
                        <div class="user-name" id="uName">Professor</div>
                        <div class="user-email" id="uEmail">prof@univ.edu</div>
                    </div>
                </div>
                <button class="btn btn-danger" style="width: 100%; margin-top: 16px; font-size: 0.7em;" onclick="logout()">Secure Logout</button>
            </div>
        </aside>

        <main class="main">
            <header class="page-header animate-fade">
                <p>Support Terminal</p>
                <h1>Inquiry<br><em>Archives.</em></h1>
            </header>

            <div id="tList" class="ticket-list animate-fade">
                <div
                    style="padding:100px; text-align:center; font-family:'DM Mono'; color:var(--text-muted); font-size:0.8em; letter-spacing:2px;">
                    SCANNING FREQUENCIES...</div>
            </div>
        </main>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000/api';
        const token = localStorage.getItem('token');
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        document.getElementById('uName').textContent = user.username;
        document.getElementById('uEmail').textContent = user.email;
        document.getElementById('av').textContent = (user.username || 'P')[0].toUpperCase();

        async function loadTickets() {
            try {
                const res = await fetch(`${API}/admin/tickets`, { headers });
                const d = await res.json();
                const tickets = d.data || [];
                const el = document.getElementById('tList');

                if (tickets.length === 0) {
                    el.innerHTML = '<div style="padding:100px; text-align:center; font-family:\'DM Mono\'; color:var(--text-muted); font-size:0.8em;">ALL SYSTEMS NOMINAL — NO OPEN TICKETS</div>';
                    return;
                }

                el.innerHTML = tickets.map(t => `
                    <div class="ticket">
                        <div class="t-user">
                            <div class="t-user-av">${t.username[0].toUpperCase()}</div>
                            <div class="t-user-name">${t.username}</div>
                            <div class="t-user-email">${t.email}</div>
                        </div>
                        <div class="t-content">
                            <div class="t-meta">
                                <div class="t-subject">${t.subject}</div>
                                <div class="t-date">${new Date(t.created_at).toLocaleDateString()} — ${new Date(t.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                            </div>
                            <div class="t-msg">${t.message}</div>
                            <div class="t-status">
                                <span class="st-badge">Level I Inquiry</span>
                                <span style="font-family:'DM Mono'; font-size:0.6em; color:var(--text-muted); font-weight:700;">SECURE CHANNEL ACTIVE</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function logout() { localStorage.clear(); window.location.href = '../index.html'; }
        loadTickets();
    </script>
</body>

</html>
