<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPGen Admin — Faculty Archives</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #050505; --deep: #0a0a0a; --surface: #0f0f0f;
            --card: rgba(25, 25, 25, 0.6); --border: rgba(255, 255, 255, 0.08);
            --gold: #c9a84c; --gold-light: #e2c07a; --violet: #8e44ad;
            --white: #f5f0e8; --muted: #5a5a5a; --text: #a8a39a; --sw: 240px;
        }

        html, body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
        .ambient-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(142, 68, 173, 0.05) 0%, transparent 70%); top: -100px; left: -100px; }

        .layout { display: flex; min-height: 100vh; }

        /* ── SIDEBAR ── */
        .sidebar { width: var(--sw); background: rgba(10,10,10,0.8); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; padding: 40px 24px; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 60px; }
        .logo-mark { width: 32px; height: 32px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; color: var(--gold); }
        .logo-text { font-family: 'DM Mono', monospace; font-size: 0.75em; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
        
        .nav-section { font-family: 'DM Mono', monospace; font-size: 0.6em; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 24px 0 12px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; color: var(--text); text-decoration: none; font-size: 0.85em; transition: all 0.3s; margin-bottom: 4px; }
        .nav-item:hover, .nav-item.active { color: var(--gold); background: rgba(201, 168, 76, 0.04); }
        .nav-item.active::before { content: ''; position: absolute; left: -24px; top: 10%; bottom: 10%; width: 3px; background: var(--gold); }

        /* ── MAIN ── */
        .main { margin-left: var(--sw); flex: 1; padding: 80px; }
        .page-hdr { margin-bottom: 60px; }
        .page-hdr p { font-family: 'DM Mono', monospace; font-size: 0.7em; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
        .page-hdr h1 { font-family: 'Playfair Display', serif; font-size: 3.5em; font-weight: 900; letter-spacing: -2px; line-height: 1; }
        .page-hdr h1 em { font-style: italic; color: var(--gold); }

        /* ── ARCHIVE TABLE ── */
        .table-panel { background: var(--surface); border: 1px solid var(--border); overflow: hidden; animation: fadeIn 0.8s ease; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 20px 32px; font-family: 'DM Mono', monospace; font-size: 0.65em; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--deep); }
        td { padding: 24px 32px; font-size: 0.9em; border-bottom: 1px solid var(--border); color: var(--text); transition: background 0.3s; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .badge { display: inline-block; padding: 4px 10px; font-family: 'DM Mono', monospace; font-size: 0.6em; border: 1px solid var(--border); margin-right: 6px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .badge-gold { border-color: var(--gold); color: var(--gold); }

        .btn { padding: 10px 20px; font-family: 'DM Mono', monospace; font-size: 0.65em; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.3s; border: 1px solid var(--border); background: transparent; color: var(--text); }
        .btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.05); }

        /* ── MODAL ── */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 1000; display: none; align-items: center; justify-content: center; animation: fadeIn 0.3s ease; }
        .modal { width: 100%; max-width: 550px; background: var(--surface); border: 1px solid var(--border); padding: 50px; position: relative; }
        .m-title { font-family: 'Playfair Display', serif; font-size: 1.8em; margin-bottom: 32px; text-align: center; }
        
        .subj-list { display: grid; gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 12px; }
        .subj-item { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--deep); border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
        .subj-item.selected { border-color: var(--gold); background: rgba(201,168,76,0.05); }
        .subj-item i { font-family: 'DM Mono'; font-size: 0.7em; color: var(--muted); }

        .btn-save { width: 100%; margin-top: 32px; padding: 16px; background: var(--gold); color: var(--black); border: none; font-weight: 700; font-family: 'DM Mono'; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .btn-save:hover { background: var(--gold-light); transform: translateY(-2px); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>

<body>
    <div class="ambient-bg"><div class="glow"></div></div>

    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><div class="logo-mark">Q</div><div class="logo-text">QPGen</div></div>
            <div class="nav-section">Workspace</div>
            <a href="../dashboard.html" class="nav-item">Dashboard</a>
            <a href="../questions.html" class="nav-item">Question Bank</a>
            <a href="../generate.html" class="nav-item">Generate Paper</a>
            <div class="nav-section">Administration</div>
            <a href="teachers.html" class="nav-item active">Faculty Archives</a>
            <a href="requests.html" class="nav-item">Subject Requests</a>
            <div style="margin-top: auto;"><a href="#" class="nav-item" onclick="logout()">Sign Out</a></div>
        </aside>

        <main class="main">
            <header class="page-hdr">
                <p>System Administration</p>
                <h1>Faculty<br><em>Access Hub.</em></h1>
            </header>

            <div class="table-panel">
                <table>
                    <thead>
                        <tr>
                            <th>Faculty Member</th>
                            <th>Neural Identifier (Email)</th>
                            <th>Allocated Domains</th>
                            <th style="text-align:right">Management</th>
                        </tr>
                    </thead>
                    <tbody id="tList">
                        <tr><td colspan="4" style="text-align:center; padding:100px; font-family:'DM Mono'; color:var(--muted);">SYNCHRONIZING RECORDS...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="overlay" id="mOverlay">
        <div class="modal">
            <div style="position:absolute; top:30px; right:30px; cursor:pointer; color:var(--muted);" onclick="closeModal()">✕</div>
            <h2 class="m-title" id="mUser">Domain Allocation</h2>
            <div class="subj-list" id="sList"></div>
            <button class="btn-save" id="saveBtn" onclick="saveAssignment()">Update Access Protocols →</button>
        </div>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000/api';
        const token = localStorage.getItem('token');
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        let teachers = [], allSubjects = [], activeId = null;

        async function init() {
            try {
                const [tR, sR] = await Promise.all([
                    fetch(`${API}/admin/teachers`, { headers }),
                    fetch(`${API}/subjects/`, { headers })
                ]);
                const tD = await tR.json(), sD = await sR.json();
                teachers = tD.teachers || [];
                allSubjects = sD.subjects || [];
                render();
            } catch (e) { console.error(e); }
        }

        function render() {
            const list = document.getElementById('tList');
            if (teachers.length === 0) {
                list.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:100px; color:var(--muted);">NO RECORDS FOUND</td></tr>';
                return;
            }
            list.innerHTML = teachers.map((t, idx) => `
                <tr>
                    <td style="color:var(--white); font-weight:600;">${t.username}</td>
                    <td style="font-family:'DM Mono'; font-size:0.8em; color:var(--muted);">${t.email}</td>
                    <td>${t.subjects.length > 0 ? t.subjects.map(s => `<span class="badge badge-gold">${s.code}</span>`).join('') : '<span class="badge">None</span>'}</td>
                    <td style="text-align:right;"><button class="btn" onclick="openModal(${idx})">Manage Access</button></td>
                </tr>
            `).join('');
        }

        function openModal(idx) {
            const t = teachers[idx];
            activeId = t.id;
            document.getElementById('mUser').textContent = `Allocating: ${t.username}`;
            const assignedIds = t.subjects.map(s => s.id);
            document.getElementById('sList').innerHTML = allSubjects.map(s => `
                <div class="subj-item ${assignedIds.includes(s.id) ? 'selected' : ''}" data-id="${s.id}" onclick="this.classList.toggle('selected')">
                    <div style="flex:1;">
                        <div style="font-size:0.9em; font-weight:600;">${s.name}</div>
                        <i>${s.code}</i>
                    </div>
                </div>
            `).join('');
            document.getElementById('mOverlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('mOverlay').style.display = 'none'; }

        async function saveAssignment() {
            const ids = Array.from(document.querySelectorAll('.subj-item.selected')).map(el => parseInt(el.dataset.id));
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.textContent = 'TRANSMITTING...';
            try {
                const res = await fetch(`${API}/admin/assign-subjects`, {
                    method: 'POST', headers, body: JSON.stringify({ teacher_id: activeId, subject_ids: ids })
                });
                if (res.ok) { closeModal(); init(); } else alert('Update Failed');
            } catch (e) { alert('System Link Failure'); }
            finally { btn.disabled = false; btn.textContent = 'Update Access Protocols →'; }
        }

        function logout() { localStorage.clear(); window.location.href = '../index.html'; }
        init();
    </script>
</body>

</html>
