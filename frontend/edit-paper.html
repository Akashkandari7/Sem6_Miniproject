<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPGen — Archival Editor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #050505; --deep: #0a0a0a; --surface: #0f0f0f;
            --card: rgba(25, 25, 25, 0.6); --border: rgba(255, 255, 255, 0.08);
            --gold: #c9a84c; --gold-light: #e2c07a; --violet: #8e44ad;
            --white: #f5f0e8; --muted: #5a5a5a; --text: #a8a39a; --sw: 240px;
        }

        html, body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
        .ambient-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(201, 168, 76, 0.05) 0%, transparent 70%); top: -100px; right: -100px; }

        .layout { display: flex; min-height: 100vh; }

        /* ── SIDEBAR ── */
        .sidebar { width: var(--sw); background: rgba(10,10,10,0.8); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; padding: 40px 24px; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 60px; }
        .logo-mark { width: 32px; height: 32px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; color: var(--gold); }
        .logo-text { font-family: 'DM Mono', monospace; font-size: 0.75em; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
        
        .nav-section { font-family: 'DM Mono', monospace; font-size: 0.6em; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 24px 0 12px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; color: var(--text); text-decoration: none; font-size: 0.85em; transition: all 0.3s; margin-bottom: 4px; }
        .nav-item:hover, .nav-item.active { color: var(--gold); background: rgba(201, 168, 76, 0.04); }

        /* ── MAIN ── */
        .main { margin-left: var(--sw); flex: 1; padding: 80px; }
        .page-hdr { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 60px; }
        .page-hdr h1 { font-family: 'Playfair Display', serif; font-size: 3.5em; font-weight: 900; letter-spacing: -2px; line-height: 1; }
        .page-hdr h1 em { font-style: italic; color: var(--gold); }
        .header-actions { display: flex; gap: 16px; }

        .btn { padding: 14px 28px; font-family: 'DM Mono', monospace; font-size: 0.7em; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; border: 1px solid var(--border); background: transparent; color: var(--white); }
        .btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
        .btn-primary { background: var(--gold); color: var(--black); border: none; font-weight: 700; }
        .btn-primary:hover { background: var(--gold-light); }

        /* ── META GRID ── */
        .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 60px; }
        .meta-card { background: var(--surface); border: 1px solid var(--border); padding: 32px; }
        .meta-lbl { font-family: 'DM Mono', monospace; font-size: 0.6em; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 12px; }
        .meta-val { font-family: 'Playfair Display', serif; font-size: 1.8em; color: var(--white); font-weight: 700; }

        /* ── QUESTION LIST ── */
        .q-list { display: flex; flex-direction: column; gap: 2px; background: var(--border); border: 1px solid var(--border); }
        .q-card { background: var(--surface); padding: 40px; border-bottom: 1px solid var(--border); transition: background 0.3s; }
        .q-card:hover { background: rgba(255, 255, 255, 0.02); }
        .q-head { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .q-idx { font-family: 'DM Mono'; font-size: 0.8em; color: var(--gold); }
        .q-pts { font-family: 'Playfair Display'; font-style: italic; color: var(--muted); }
        .q-body { font-size: 1.1em; line-height: 1.7; color: var(--white); margin-bottom: 24px; }
        .q-foot { display: flex; align-items: center; gap: 12px; }
        .badge { font-family: 'DM Mono'; font-size: 0.6em; padding: 4px 10px; border: 1px solid var(--border); color: var(--muted); text-transform: uppercase; }

        .btn-rem { margin-left: auto; color: #e74c3c; border-color: rgba(231, 76, 60, 0.2); font-size: 0.6em; }
        .btn-rem:hover { border-color: #e74c3c; background: rgba(231, 76, 60, 0.05); }

        .add-zone { margin-top: 40px; padding: 40px; border: 1px dashed var(--border); text-align: center; }

        /* ── MODAL ── */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(20px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal { width: 100%; max-width: 800px; background: var(--surface); border: 1px solid var(--border); padding: 50px; }
        .modal-body { max-height: 500px; overflow-y: auto; margin-top: 30px; }
        .search-box { width: 100%; background: var(--deep); border: 1px solid var(--border); padding: 16px; color: var(--white); font-family: inherit; margin-bottom: 24px; outline: none; }
        .search-box:focus { border-color: var(--gold); }

        .pool-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
        .pool-item:hover { border-color: var(--gold); background: rgba(201,168,76,0.05); }

    </style>
</head>

<body>
    <div class="ambient-bg"><div class="glow"></div></div>

    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><div class="logo-mark">Q</div><div class="logo-text">QPGen</div></div>
            <div class="nav-section">Workspace</div>
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="questions.html" class="nav-item">Question Bank</a>
            <a href="generate.html" class="nav-item">Generate Paper</a>
            <div style="margin-top:auto;"><a href="#" class="nav-item" onclick="logout()">Sign Out</a></div>
        </aside>

        <main class="main">
            <header class="page-hdr">
                <div>
                    <p style="font-family:'DM Mono'; font-size:0.7em; color:var(--gold); letter-spacing:3px; text-transform:uppercase;">Customization Terminal</p>
                    <h1 id="pTitle">Archival<br><em>Refinement.</em></h1>
                </div>
                <div class="header-actions">
                    <button class="btn" onclick="downloadPdf()">Preview PDF ↓</button>
                    <button class="btn btn-primary" onclick="saveChanges()">Commit Changes →</button>
                </div>
            </header>

            <div class="meta-grid">
                <div class="meta-card"><div class="meta-lbl">TOTAL SCORE</div><div class="meta-val" id="mTotal">—</div></div>
                <div class="meta-card"><div class="meta-lbl">ITEM COUNT</div><div class="meta-val" id="mCount">—</div></div>
                <div class="meta-card"><div class="meta-lbl">DOMAIN</div><div class="meta-val" id="mSub">—</div></div>
            </div>

            <div class="q-list" id="qList">
                <div style="padding:100px; text-align:center; font-family:'DM Mono'; color:var(--muted);">LOADING ARCHIVAL DATA...</div>
            </div>

            <div class="add-zone">
                <button class="btn" style="border-style:dashed; padding:16px 40px;" onclick="openPool()">+ Supplement Archive</button>
            </div>
        </main>
    </div>

    <!-- Pool Modal -->
    <div class="overlay" id="poolOverlay">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <h2 style="font-family:'Playfair Display'; font-size:2em;">Question <em>Pool</em></h2>
                <div style="cursor:pointer; color:var(--muted);" onclick="closePool()">✕</div>
            </div>
            <input type="text" class="search-box" id="poolSearch" placeholder="Search archive for supplement items..." onkeyup="filterPool()">
            <div class="modal-body" id="poolList"></div>
        </div>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000/api';
        const token = localStorage.getItem('token');
        const params = new URLSearchParams(window.location.search);
        const paperId = params.get('id');
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        let paperQuestions = [], allQuestions = [], currentPaper = null;

        async function init() {
            try {
                const res = await fetch(`${API}/papers/${paperId}`, { headers });
                const d = await res.json();
                currentPaper = d.paper;
                paperQuestions = d.paper.questions;
                
                const qRes = await fetch(`${API}/questions/?subject_id=${currentPaper.subject_id}`, { headers });
                const qD = await qRes.json();
                allQuestions = qD.questions || [];

                render();
            } catch (e) { alert('Archival Link Lost'); }
        }

        function render() {
            document.getElementById('pTitle').innerHTML = `Drafting<br><em>${currentPaper.title}.</em>`;
            document.getElementById('mTotal').textContent = paperQuestions.reduce((s, q) => s + q.marks, 0);
            document.getElementById('mCount').textContent = paperQuestions.length;
            document.getElementById('mSub').textContent = currentPaper.subject.name.toUpperCase();

            const list = document.getElementById('qList');
            list.innerHTML = paperQuestions.map((q, i) => `
                <div class="q-card">
                    <div class="q-head">
                        <div class="q-idx">ITEM ${String(i+1).padStart(2, '0')}</div>
                        <div class="q-pts">${q.marks} PTS</div>
                    </div>
                    <div class="q-body">${q.text}</div>
                    <div class="q-foot">
                        <span class="badge">${q.blooms_level}</span>
                        <span class="badge">${q.difficulty}</span>
                        <button class="btn btn-rem" onclick="removeItem(${i})">X DISCARD</button>
                    </div>
                </div>
            `).join('');
        }

        function removeItem(i) { paperQuestions.splice(i, 1); render(); }

        function openPool() {
            document.getElementById('poolOverlay').style.display = 'flex';
            filterPool();
        }
        function closePool() { document.getElementById('poolOverlay').style.display = 'none'; }

        function filterPool() {
            const s = document.getElementById('poolSearch').value.toLowerCase();
            const filtered = allQuestions.filter(q => 
                !paperQuestions.find(pq => pq.id === q.id) && q.text.toLowerCase().includes(s)
            );
            document.getElementById('poolList').innerHTML = filtered.map(q => `
                <div class="pool-item" onclick="addItem(${q.id})">
                    <div style="flex:1;">
                        <div style="font-size:0.95em; color:var(--text); margin-bottom:8px;">${q.text}</div>
                        <span class="badge">${q.marks} PTS</span> <span class="badge">${q.blooms_level}</span>
                    </div>
                    <button class="btn" style="padding:6px 12px; font-size:0.6em; color:var(--gold); border-color:var(--gold);">IMPORT</button>
                </div>
            `).join('');
        }

        function addItem(id) {
            const q = allQuestions.find(q => q.id === id);
            if (q) { paperQuestions.push(q); render(); closePool(); }
        }

        async function saveChanges() {
            try {
                const res = await fetch(`${API}/papers/${paperId}`, {
                    method: 'PUT', headers, body: JSON.stringify({ question_ids: paperQuestions.map(q => q.id) })
                });
                if (res.ok) alert('Archives Synced Successfully'); else alert('Sync Failed');
            } catch (e) { alert('Terminal Link Lost'); }
        }

        async function downloadPdf() {
            try {
                const res = await fetch(`${API}/papers/${paperId}/pdf`, { headers });
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentPaper.title}.pdf`;
                a.click();
            } catch (e) { alert('PDF Synthesis Failed'); }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        init();
    </script>
</body>

</html>
