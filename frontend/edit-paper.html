<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPGen — Archival Editor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <style>
        .page-hdr h1 em {
            font-style: italic;
            color: var(--brand);
        }

        .header-actions {
            display: flex;
            gap: 16px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            font-family: 'DM Mono', monospace;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: var(--radius-sm);
            text-decoration: none;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-secondary);
        }

        .btn-action:hover {
            border-color: var(--brand);
            color: var(--brand);
            transform: translateY(-2px);
            background: var(--brand-dim);
        }

        .btn-primary {
            background: var(--brand);
            color: white;
            border: none;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--brand-light);
            box-shadow: var(--shadow-md);
            color: white;
        }

        /* ── META GRID ── */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 60px;
        }

        .meta-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }

        .meta-lbl {
            font-family: 'DM Mono', monospace;
            font-size: 0.6em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .meta-val {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            color: var(--text-primary);
            font-weight: 900;
        }

        /* ── QUESTION LIST ── */
        .q-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .q-card {
            background: var(--surface);
            padding: 40px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .q-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .q-head {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            align-items: center;
        }

        .q-idx {
            font-family: 'DM Mono';
            font-size: 0.8em;
            color: var(--brand);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .q-pts {
            font-family: 'Playfair Display';
            font-style: italic;
            color: var(--text-muted);
            font-weight: 700;
        }

        .q-body {
            font-size: 1.05em;
            line-height: 1.7;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .q-foot {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .badge {
            font-family: 'DM Mono';
            font-size: 0.6em;
            padding: 4px 10px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            text-transform: uppercase;
            border-radius: 4px;
            font-weight: 500;
        }

        .btn-rem {
            margin-left: auto;
            color: #ef4444;
            border: 1px solid #fee2e2;
            background: #fff;
            padding: 6px 12px;
            font-family: 'DM Mono';
            font-size: 0.65em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .btn-rem:hover {
            background: #fef2f2;
            border-color: #ef4444;
        }

        .add-zone {
            margin-top: 40px;
            padding: 60px;
            border: 2px dashed var(--border);
            text-align: center;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }

        .add-zone:hover {
            border-color: var(--brand);
            background: var(--brand-dim);
        }

        /* ── MODAL ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 36, 0.4);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 48px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }

        .modal-body {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 30px;
            padding-right: 12px;
        }

        .search-box {
            width: 100%;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: inherit;
            margin-bottom: 24px;
            outline: none;
            border-radius: var(--radius-sm);
            font-size: 0.95em;
        }

        .search-box:focus {
            border-color: var(--brand);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--brand-dim);
        }

        .pool-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .pool-item:hover {
            background: var(--brand-dim);
        }
    </style>
</head>

<body>
    <div class="ambient-bg">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <a href="dashboard.html" class="logo">
                <div class="logo-mark">QP</div>
                <span class="logo-text">QPGen</span>
            </a>

            <div class="nav-section">Workspace</div>
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">▤</span> Dashboard
            </a>
            <a href="questions.html" class="nav-item">
                <span class="nav-icon">⚄</span> Question Bank
            </a>
            <a href="generate.html" class="nav-item">
                <span class="nav-icon">✦</span> Generate Paper
            </a>

            <div class="nav-section">Management</div>
            <a href="profile.html" class="nav-item">
                <span class="nav-icon">👤</span> Account Profile
            </a>

            <div style="margin-top:auto;">
                <a href="#" class="nav-item" onclick="logout()">
                    <span class="nav-icon">⏻</span> Secure Logout
                </a>
            </div>
        </aside>

        <main class="main">
            <header class="page-hdr" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 60px;">
                <div>
                    <p style="font-family:'DM Mono'; font-size:0.7em; color:var(--brand); letter-spacing:3px; text-transform:uppercase; margin-bottom: 12px; font-weight: 700;">
                        Customization Terminal</p>
                    <h1 id="pTitle" style="font-family: 'Playfair Display', serif; font-size: 3.5em; font-weight: 900; letter-spacing: -2px; line-height: 1;">Archival<br><em>Refinement.</em></h1>
                </div>
                <div class="header-actions" style="margin-bottom: 10px;">
                    <button class="btn-action" onclick="downloadPdf()">Preview PDF ↓</button>
                    <button class="btn-action btn-primary" onclick="saveChanges()">Commit Changes →</button>
                </div>
            </header>

            <div class="meta-grid animate-fade">
                <div class="meta-card">
                    <div class="meta-lbl">TOTAL SCORE</div>
                    <div class="meta-val" id="mTotal">—</div>
                </div>
                <div class="meta-card">
                    <div class="meta-lbl">ITEM COUNT</div>
                    <div class="meta-val" id="mCount">—</div>
                </div>
                <div class="meta-card">
                    <div class="meta-lbl">DOMAIN</div>
                    <div class="meta-val" id="mSub">—</div>
                </div>
            </div>

            <div class="q-list animate-fade" id="qList">
                <div style="padding:100px; text-align:center; font-family:'DM Mono'; color:var(--text-muted);">LOADING
                    ARCHIVAL DATA...</div>
            </div>

            <div class="add-zone animate-fade">
                <button class="btn-action" style="border-style:dashed; padding:16px 40px; width: 100%; max-width: 400px;" onclick="openPool()">+ Supplement Archive</button>
            </div>
        </main>
    </div>

    <!-- Pool Modal -->
    <div class="overlay" id="poolOverlay">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <h2 style="font-family:'Playfair Display'; font-size:2.2em; font-weight: 700;">Question <em>Pool</em></h2>
                <div style="cursor:pointer; color:var(--text-muted); font-size: 1.5em;" onclick="closePool()">✕</div>
            </div>
            <input type="text" class="search-box" id="poolSearch" placeholder="Search archive for supplement items..."
                onkeyup="filterPool()">
            <div class="modal-body" id="poolList"></div>
        </div>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000/api';
        const token = localStorage.getItem('token');
        const params = new URLSearchParams(window.location.search);
        const paperId = params.get('id');
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        let paperQuestions = [], allQuestions = [], currentPaper = null;

        async function init() {
            try {
                const res = await fetch(`${API}/papers/${paperId}`, { headers });
                const d = await res.json();
                currentPaper = d.paper;
                paperQuestions = d.paper.questions;

                const qRes = await fetch(`${API}/questions/?subject_id=${currentPaper.subject_id}`, { headers });
                const qD = await qRes.json();
                allQuestions = qD.questions || [];

                const user = JSON.parse(localStorage.getItem('user') || '{}');
                // sidebar data
                // handled by style commonalities or inline if needed

                render();
            } catch (e) { alert('Archival Link Lost'); }
        }

        function render() {
            document.getElementById('pTitle').innerHTML = `Drafting<br><em>${currentPaper.title}.</em>`;
            document.getElementById('mTotal').textContent = paperQuestions.reduce((s, q) => s + q.marks, 0);
            document.getElementById('mCount').textContent = paperQuestions.length;
            document.getElementById('mSub').textContent = currentPaper.subject.name.toUpperCase();

            const list = document.getElementById('qList');
            list.innerHTML = paperQuestions.map((q, i) => `
                <div class="q-card">
                    <div class="q-head">
                        <div class="q-idx">ITEM ${String(i + 1).padStart(2, '0')}</div>
                        <div class="q-pts">${q.marks} PTS</div>
                    </div>
                    <div class="q-body">${q.text}</div>
                    <div class="q-foot">
                        <span class="badge">${q.blooms_level}</span>
                        <span class="badge">${q.difficulty}</span>
                        <button class="btn-rem" onclick="removeItem(${i})">X DISCARD</button>
                    </div>
                </div>
            `).join('');
        }

        function removeItem(i) { paperQuestions.splice(i, 1); render(); }

        function openPool() {
            document.getElementById('poolOverlay').style.display = 'flex';
            filterPool();
        }
        function closePool() { document.getElementById('poolOverlay').style.display = 'none'; }

        function filterPool() {
            const s = document.getElementById('poolSearch').value.toLowerCase();
            const filtered = allQuestions.filter(q =>
                !paperQuestions.find(pq => pq.id === q.id) && q.text.toLowerCase().includes(s)
            );
            document.getElementById('poolList').innerHTML = filtered.map(q => `
                <div class="pool-item" onclick="addItem(${q.id})">
                    <div style="flex:1;">
                        <div style="font-size:1em; color:var(--text-primary); margin-bottom:8px; line-height: 1.5;">${q.text}</div>
                        <span class="badge">${q.marks} PTS</span> <span class="badge">${q.blooms_level}</span>
                    </div>
                    <button class="btn-action" style="padding:6px 16px; font-size:0.65em; color:var(--brand); border-color:var(--brand);">IMPORT</button>
                </div>
            `).join('');
        }

        function addItem(id) {
            const q = allQuestions.find(q => q.id === id);
            if (q) { paperQuestions.push(q); render(); closePool(); }
        }

        async function saveChanges() {
            try {
                const res = await fetch(`${API}/papers/${paperId}`, {
                    method: 'PUT', headers, body: JSON.stringify({ question_ids: paperQuestions.map(q => q.id) })
                });
                if (res.ok) alert('Archives Synced Successfully'); else alert('Sync Failed');
            } catch (e) { alert('Terminal Link Lost'); }
        }

        async function downloadPdf() {
            try {
                const res = await fetch(`${API}/papers/${paperId}/pdf`, { headers });
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentPaper.title}.pdf`;
                a.click();
            } catch (e) { alert('PDF Synthesis Failed'); }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        init();
    </script>
</body>

</html>
