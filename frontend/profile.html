<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPGen — My Profile</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --deep: #0e0e0e;
            --surface: #141414;
            --card: #1a1a1a;
            --border: rgba(255, 255, 255, 0.07);
            --gold: #c9a84c;
            --white: #f5f0e8;
            --muted: #5a5a5a;
            --text: #b8b3a8;
            --sw: 220px;
        }

        html,
        body {
            background: var(--black);
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sw);
            background: var(--deep);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 50;
            padding: 32px 20px;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            color: var(--gold);
        }

        .logo-text {
            font-family: 'DM Mono', monospace;
            font-size: 0.75em;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85em;
            transition: all 0.3s;
            margin-bottom: 4px;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--gold);
            background: rgba(201, 168, 76, 0.05);
        }

        .main {
            margin-left: var(--sw);
            flex: 1;
            padding: 60px;
        }

        .profile-header {
            display: flex;
            align-items: flex-end;
            gap: 32px;
            margin-bottom: 60px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border);
        }

        .avatar-lg {
            width: 120px;
            height: 120px;
            background: var(--gold-dim);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            color: var(--gold);
        }

        .profile-info h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            margin-bottom: 8px;
        }

        .profile-info p {
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 60px;
        }

        .stat-card {
            background: var(--surface);
            padding: 32px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-val {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-lbl {
            font-family: 'DM Mono', monospace;
            font-size: 0.65em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .content-sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .sect-title {
            font-family: 'DM Mono', monospace;
            font-size: 0.7em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sect-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .subj-tag {
            display: inline-block;
            padding: 6px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            font-size: 0.8em;
            margin: 0 8px 8px 0;
            color: var(--text);
        }

        .help-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: var(--black);
            border: 1px solid var(--border);
            color: var(--white);
            padding: 14px;
            font-family: inherit;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--gold);
        }

        .btn-send {
            background: var(--gold);
            color: var(--black);
            border: none;
            padding: 14px 28px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .msg-box {
            padding: 12px;
            font-size: 0.8em;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid;
        }

        .msg-box.success { background: rgba(201, 168, 76, 0.1); border-color: var(--gold); color: var(--gold); }
    </style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-mark">Q</div>
                <div class="logo-text">QPGen</div>
            </div>
            <a class="nav-item" href="dashboard.html">Dashboard</a>
            <a class="nav-item" href="questions.html">Question Bank</a>
            <a class="nav-item" href="generate.html">Generate Paper</a>
            <a class="nav-item active" href="profile.html">My Profile</a>
            <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--border)">
                <a class="nav-item" href="#" onclick="logout()">Sign Out</a>
            </div>
        </aside>

        <main class="main">
            <div id="profileLoading" style="text-align: center; padding-top: 100px; color: var(--muted);">Establishing neural link...</div>
            
            <div id="profileBody" style="display: none;">
                <header class="profile-header">
                    <div class="avatar-lg" id="pLetter">U</div>
                    <div class="profile-info">
                        <h1 id="pName">Professor Name</h1>
                        <p id="pEmail">email@university.edu</p>
                    </div>
                </header>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-val" id="sPapers">0</div>
                        <div class="stat-lbl">Papers Created</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="sQuestions">0</div>
                        <div class="stat-lbl">Questions Added</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="sSubjects">0</div>
                        <div class="stat-lbl">Subjects Assigned</div>
                    </div>
                </div>

                <div class="content-sections">
                    <div>
                        <h2 class="sect-title">Active Subjects</h2>
                        <div id="subjectsList"></div>
                    </div>

                    <div>
                        <h2 class="sect-title">Help & Support</h2>
                        <div class="help-card">
                            <div class="msg-box success" id="helpSuc">Message sent to Admin.</div>
                            <div class="form-group">
                                <label>Subject</label>
                                <input type="text" id="hSub" placeholder="Issue with Paper generation...">
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="hMsg" rows="4" placeholder="Describe your problem or request..."></textarea>
                            </div>
                            <button class="btn-send" onclick="sendHelp()">Submit Ticket</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        async function loadProfile() {
            try {
                const res = await fetch(`${API}/teacher/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                const u = data.data.user;
                const stats = data.data.stats;

                document.getElementById('pName').textContent = u.username;
                document.getElementById('pEmail').textContent = u.email;
                document.getElementById('pLetter').textContent = u.username[0].toUpperCase();

                document.getElementById('sPapers').textContent = stats.papers;
                document.getElementById('sQuestions').textContent = stats.questions;
                document.getElementById('sSubjects').textContent = stats.subjects;

                document.getElementById('subjectsList').innerHTML = data.data.subjects.map(s => `
                    <span class="subj-tag">${s.name} (${s.code})</span>
                `).join('');

                document.getElementById('profileLoading').style.display = 'none';
                document.getElementById('profileBody').style.display = 'block';
            } catch (e) {
                alert('Error loading profile: ' + e.message);
            }
        }

        async function sendHelp() {
            const subject = document.getElementById('hSub').value;
            const message = document.getElementById('hMsg').value;
            if (!subject || !message) return alert('Fill all fields.');

            const res = await fetch(`${API}/teacher/support`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ subject, message })
            });

            if (res.ok) {
                document.getElementById('helpSuc').style.display = 'block';
                document.getElementById('hSub').value = '';
                document.getElementById('hMsg').value = '';
                setTimeout(() => document.getElementById('helpSuc').style.display = 'none', 3000);
            }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        loadProfile();
    </script>
</body>

</html>
